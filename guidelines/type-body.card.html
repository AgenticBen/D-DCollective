<!doctype html><html lang="en" data-theme="light"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0}body{background:var(--bg);color:var(--ink);font-family:var(--font-sans);font-size:var(--fs-body);line-height:var(--lh-body);padding:20px 22px;box-sizing:border-box}.sw{display:flex;gap:0;border-radius:var(--radius-tile);overflow:hidden;border:var(--border-1)}.sw>div{flex:1;height:64px;display:flex;align-items:flex-end;padding:8px;font-family:var(--font-mono);font-size:10.5px;letter-spacing:.02em}.row{display:flex;gap:14px;align-items:flex-end;flex-wrap:wrap}.k{font-size:var(--fs-eyebrow);font-weight:var(--fw-medium);letter-spacing:var(--ls-eyebrow);text-transform:uppercase;color:var(--teal-deep)}.mono{font-family:var(--font-mono);font-size:12px;color:var(--muted)}</style></head><body><p style="margin:0 0 8px;max-width:var(--measure-lede);color:var(--muted)">Draft language for the site, pulled from the Praxis Capital Fellowship manifesto.</p><p style="margin:0;max-width:var(--measure-prose)">Every partner named on the site should get a quick consent check and a current one-line description from them.</p><div class="mono" style="margin-top:8px">16px / 1.6 · lede max 66ch · prose max 68ch</div></body></html>
