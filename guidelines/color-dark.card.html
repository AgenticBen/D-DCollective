<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0}body{background:var(--bg);color:var(--ink);font-family:var(--font-sans);font-size:var(--fs-body);line-height:var(--lh-body);padding:20px 22px;box-sizing:border-box}.sw{display:flex;gap:0;border-radius:var(--radius-tile);overflow:hidden;border:var(--border-1)}.sw>div{flex:1;height:64px;display:flex;align-items:flex-end;padding:8px;font-family:var(--font-mono);font-size:10.5px;letter-spacing:.02em}.row{display:flex;gap:14px;align-items:flex-end;flex-wrap:wrap}.k{font-size:var(--fs-eyebrow);font-weight:var(--fw-medium);letter-spacing:var(--ls-eyebrow);text-transform:uppercase;color:var(--teal-deep)}.mono{font-family:var(--font-mono);font-size:12px;color:var(--muted)}</style></head><body><div class="sw"><div style="background:#0A0A0A;color:#F2F6F7">#0A0A0A bg</div><div style="background:#101B1D;color:#F2F6F7">#101B1D mist</div><div style="background:#131F22;color:#F2F6F7">#131F22 card</div><div style="background:#22383C;color:#F2F6F7">#22383C line</div><div style="background:#F2F6F7;color:#0A0A0A">#F2F6F7 ink</div></div><div class="mono" style="margin-top:10px">follows prefers-color-scheme unless [data-theme] is set</div></body></html>
