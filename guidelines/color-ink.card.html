<!doctype html><html lang="en" data-theme="light"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0}body{background:var(--bg);color:var(--ink);font-family:var(--font-sans);font-size:var(--fs-body);line-height:var(--lh-body);padding:20px 22px;box-sizing:border-box}.sw{display:flex;gap:0;border-radius:var(--radius-tile);overflow:hidden;border:var(--border-1)}.sw>div{flex:1;height:64px;display:flex;align-items:flex-end;padding:8px;font-family:var(--font-mono);font-size:10.5px;letter-spacing:.02em}.row{display:flex;gap:14px;align-items:flex-end;flex-wrap:wrap}.k{font-size:var(--fs-eyebrow);font-weight:var(--fw-medium);letter-spacing:var(--ls-eyebrow);text-transform:uppercase;color:var(--teal-deep)}.mono{font-family:var(--font-mono);font-size:12px;color:var(--muted)}</style></head><body><div class="sw"><div style="background:#0A0A0A;color:#fff">#0A0A0A ink</div><div style="background:#2D3748;color:#fff">#2D3748 slate</div><div style="background:#5B6B78;color:#fff">#5B6B78 muted</div></div><div class="mono" style="margin-top:10px">--text-strong · --text-body · --text-muted</div></body></html>
