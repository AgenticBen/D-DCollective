<!doctype html><html lang="en" data-theme="light"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0}body{background:var(--bg);color:var(--ink);font-family:var(--font-sans);font-size:var(--fs-body);line-height:var(--lh-body);padding:20px 22px;box-sizing:border-box}.sw{display:flex;gap:0;border-radius:var(--radius-tile);overflow:hidden;border:var(--border-1)}.sw>div{flex:1;height:64px;display:flex;align-items:flex-end;padding:8px;font-family:var(--font-mono);font-size:10.5px;letter-spacing:.02em}.row{display:flex;gap:14px;align-items:flex-end;flex-wrap:wrap}.k{font-size:var(--fs-eyebrow);font-weight:var(--fw-medium);letter-spacing:var(--ls-eyebrow);text-transform:uppercase;color:var(--teal-deep)}.mono{font-family:var(--font-mono);font-size:12px;color:var(--muted)}</style></head><body><div style="display:grid;gap:18px"><div><div class="k">Mission, vision, and values</div><div style="height:2px;width:56px;background:var(--grad);border-radius:2px;margin-top:10px"></div></div><div style="height:2px;width:100%;background:var(--grad);border-radius:2px;opacity:.5"></div><div class="mono">--rule-width 56px · --rule-height 2px · --grad</div></div></body></html>
