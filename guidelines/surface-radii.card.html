<!-- @dsCard group="Spacing" viewport="700x150" name="Corner radii" subtitle="10 note · 12 tile/panel · 14 card · 999 pill" -->
<!doctype html><html lang="en" data-theme="light"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0}body{background:var(--bg);color:var(--ink);font-family:var(--font-sans);font-size:var(--fs-body);line-height:var(--lh-body);padding:20px 22px;box-sizing:border-box}.sw{display:flex;gap:0;border-radius:var(--radius-tile);overflow:hidden;border:var(--border-1)}.sw>div{flex:1;height:64px;display:flex;align-items:flex-end;padding:8px;font-family:var(--font-mono);font-size:10.5px;letter-spacing:.02em}.row{display:flex;gap:14px;align-items:flex-end;flex-wrap:wrap}.k{font-size:var(--fs-eyebrow);font-weight:var(--fw-medium);letter-spacing:var(--ls-eyebrow);text-transform:uppercase;color:var(--teal-deep)}.mono{font-family:var(--font-mono);font-size:12px;color:var(--muted)}</style></head><body><div class="row"><div style="text-align:center"><div style="width:96px;height:60px;border:var(--border-1);background:var(--mist);border-radius:10px"></div><div class="mono" style="font-size:10.5px;margin-top:5px">10px note</div></div><div style="text-align:center"><div style="width:96px;height:60px;border:var(--border-1);background:var(--mist);border-radius:12px"></div><div class="mono" style="font-size:10.5px;margin-top:5px">12px tile</div></div><div style="text-align:center"><div style="width:96px;height:60px;border:var(--border-1);background:var(--mist);border-radius:14px"></div><div class="mono" style="font-size:10.5px;margin-top:5px">14px card</div></div><div style="text-align:center"><div style="width:96px;height:32px;border:1px solid var(--teal);border-radius:999px"></div><div class="mono" style="font-size:10.5px;margin-top:5px">999 pill</div></div></div></body></html>
